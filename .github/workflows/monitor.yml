name: Jリーグチケット価格チェック

on:
  schedule:
    # 毎日 6:00 JST = 21:00 UTC(前日)
    - cron: "0 21 * * *"
  workflow_dispatch: {}  # 手動実行用ボタン

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージインストール
        run: pip install -r requirements.txt

      - name: 価格チェック実行
        run: python monitor.py

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ticket_prices.csv
          git diff --quiet --cached || git commit -m "chore: update ticket prices $(date -u +%Y-%m-%d)"
          git push
