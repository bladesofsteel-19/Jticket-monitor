name: Ticket sale date watch

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "デバッグモード(実際のテキストをログに出力する)"
        type: boolean
        default: false
  schedule:
    # 毎週月曜 9:00 JST = 0:00 UTC(発売日情報は毎日変わるものではないため週1回で十分)
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  check-sale-dates:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-sale.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      
      - name: クラブページの取得テスト
        run: python check_club_pages.py
        continue-on-error: true

      - name: Write Google credentials
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Run sale date watch
        run: python sale_watch.py
        env:
          GOOGLE_CREDENTIALS_PATH: service_account.json
          SALE_WATCH_DEBUG: ${{ inputs.debug && '1' || '0' }}
